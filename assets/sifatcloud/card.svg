<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Sifat.cloud — A home for everything you build. Visit sifat.cloud">
  <style>
    .sans { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .ink { fill: #252621; } .muted { fill: #66675F; } .accent { fill: #C34424; }
    .draw { stroke-dasharray: 90; animation: draw 1.2s .7s ease-out both; }
    .pa { animation: up 1s .3s cubic-bezier(.2,.7,.2,1) both; }
    .fa { animation: bob 6s 1.4s ease-in-out infinite; }
    .live { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes draw { from { stroke-dashoffset: 90 } to { stroke-dashoffset: 0 } }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .fade { animation: fade .8s ease-out both; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .25s } .d3 { animation-delay: .4s } .d4 { animation-delay: .55s }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    @keyframes up { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
  </style>
  <defs>
    <clipPath id="card"><rect width="600" height="300" rx="16"/></clipPath>
    <radialGradient id="glow" cx="82%" cy="45%" r="55%">
      <stop offset="0" stop-color="#C34424" stop-opacity=".10"/>
      <stop offset="1" stop-color="#F6F4EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#252621" flood-opacity=".14"/>
    </filter>
  </defs>
  <g clip-path="url(#card)">
    <rect width="600" height="300" fill="#F6F4EE"/>
    <rect width="600" height="300" fill="url(#glow)"/>
    <circle cx="470" cy="160" r="118" fill="none" stroke="#E6E1D6"/>
    <circle cx="470" cy="160" r="150" fill="none" stroke="#ECE8DF"/>
    <g class="fade d1">
      <rect x="34" y="30" width="34" height="34" rx="8" fill="#252621"/>
      <text x="51" y="54" class="sans" font-size="20" font-weight="700" fill="#F6F4EE" text-anchor="middle">S</text>
      <text x="78" y="54" class="sans ink" font-size="21" font-weight="700" letter-spacing="-.3">Sifat.cloud</text>
    </g>
    <text x="34" y="96" class="mono accent fade d2" font-size="11" letter-spacing="1.6">✳  YOUR PERSONAL CLOUD</text>
    <text x="32" y="138" class="sans ink fade d2" font-size="34" font-weight="600" letter-spacing="-1">A home for</text>
    <text x="32" y="178" class="sans ink fade d3" font-size="34" font-weight="600" letter-spacing="-1">everything you</text>
    <text x="32" y="218" class="sans ink fade d3" font-size="34" font-weight="600" letter-spacing="-1"><tspan class="accent">build</tspan>.</text>
    <path class="draw" d="M33 226c22 3 54 3 82-1" fill="none" stroke="#C34424" stroke-width="2.4" stroke-linecap="round"/>
    <g class="fade d4">
      <rect x="34" y="240" width="170" height="38" rx="19" fill="#252621"/>
      <text x="119" y="264" class="sans" font-size="14.5" font-weight="600" fill="#F6F4EE" text-anchor="middle">Visit sifat.cloud  →</text>
    </g>
    <g transform="translate(336 54)">
      <g class="pa"><g class="fa" filter="url(#sh)">
        <rect width="242" height="196" rx="14" fill="#FFFFFF" stroke="#E6E1D6"/>
        <g transform="translate(0 30)">
          <g fill="none" stroke="#252621" stroke-width="1.4"><rect x="21" y="-7" width="14" height="14" rx="3"/><path d="M21 -2h14"/></g>
          <text x="44" y="5" class="sans ink" font-size="14" font-weight="600">My application</text>
          <text x="226" y="4" class="mono muted" font-size="10" text-anchor="end">live</text>
          <line x1="0" y1="22" x2="242" y2="22" stroke="#ECE8DF"/>
        </g>
        <g transform="translate(0 76)">
        <g fill="none" stroke="#252621" stroke-width="1.4"><circle cx="28" cy="0" r="7"/><path d="M21 0h14M28 -7c-3 4-3 10 0 14M28 -7c3 4 3 10 0 14"/></g>
        <text x="44" y="5" class="sans ink" font-size="14">Web service</text>
        <circle cx="218" cy="0" r="4" fill="#3E8E5A" class="live"/>
        <line x1="16" y1="20" x2="226" y2="20" stroke="#ECE8DF"/>
      </g>
        <g transform="translate(0 116)">
        <g fill="none" stroke="#252621" stroke-width="1.4"><rect x="21" y="-7" width="14" height="5" rx="1"/><rect x="21" y="2" width="14" height="5" rx="1"/></g>
        <text x="44" y="5" class="sans ink" font-size="14">API service</text>
        <circle cx="218" cy="0" r="4" fill="#3E8E5A"/>
        <line x1="16" y1="20" x2="226" y2="20" stroke="#ECE8DF"/>
      </g>
        <g transform="translate(0 156)">
        <g fill="none" stroke="#252621" stroke-width="1.4"><ellipse cx="28" cy="-5" rx="7" ry="2.5"/><path d="M21 -5v10c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-10M21 0c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/></g>
        <text x="44" y="5" class="sans ink" font-size="14">Database</text>
        <text x="226" y="4" class="mono muted" font-size="10" text-anchor="end">private net</text>
        
      </g>
      </g></g>
    </g>
  </g>
  <rect x=".5" y=".5" width="599" height="299" rx="16" fill="none" stroke="#E6E1D6"/>
</svg>

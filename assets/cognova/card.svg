<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="CogNova 3.0 — Building a language model from scratch. In training: 1.33M parameters, 5 of 6 milestones done.">
  <style>
    .sans { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .fade { animation: fade .8s ease-out both; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .25s } .d3 { animation-delay: .4s } .d4 { animation-delay: .55s }
    .pa { animation: up 1s .2s cubic-bezier(.2,.7,.2,1) both; }
    .pb { animation: up 1s .45s cubic-bezier(.2,.7,.2,1) both; }
    .fa { animation: bob 6s 1.2s ease-in-out infinite; }
    .fb { animation: bob 6s 1.2s ease-in-out infinite reverse; }
    .chip { animation: fade .6s 1.1s ease-out both, bob 5s 1.7s ease-in-out infinite; }
    .live { animation: pulse 2.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes up { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
    .ink { fill: #1F2233; } .muted { fill: #686C7E; } .acc { fill: #3B4FA8; } .warm { fill: #C34424; }
    .line { stroke-dasharray: 700; animation: draw 2.4s .8s ease-out both; }
    .area { animation: fadeIn 1s 2.6s ease-out both; }
    .end { animation: fadeIn .6s 3s ease-out both; }
    .bar { transform-origin: 34px 0; animation: grow 1.4s .7s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes draw { from { stroke-dashoffset: 700 } to { stroke-dashoffset: 0 } }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="CogNova 3.0 — Building a language model from scratch. Early research log.">
  <style>
    .sans { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .ink { fill: #1F2233; } .muted { fill: #676B7E; } .acc { fill: #3B4FA8; } .warm { fill: #C34424; }
    .fade { animation: fade .8s ease-out both; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .25s } .d3 { animation-delay: .4s } .d4 { animation-delay: .55s }
    .pa { animation: up 1s .3s cubic-bezier(.2,.7,.2,1) both; }
    .fa { animation: bob 6s 1.4s ease-in-out infinite; }
    .line { stroke-dasharray: 600; animation: draw 2.2s .8s ease-out both; }
    .area { animation: fadeIn 1s 2.4s ease-out both; }
    .end { animation: fadeIn .5s 2.9s ease-out both; }
    .live { animation: pulse 2.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes up { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    @keyframes draw { from { stroke-dashoffset: 600 } to { stroke-dashoffset: 0 } }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  </style>

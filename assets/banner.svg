<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Sifat Ahmed — A little curiosity. A lot of building.">
  <style>
    .sans { font-family: 'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .ink { fill: #252621; }
    .muted { fill: #66675F; }
    .accent { fill: #C34424; }
    .spin { transform-origin: 1010px 92px; animation: spin 14s linear infinite; }
    .spin2 { transform-origin: 152px 330px; animation: spin 20s linear infinite reverse; }
    .draw { stroke-dasharray: 260; animation: draw 1.6s 0.4s ease-out both; }
    .ring { transform-origin: 930px 200px; animation: breathe 6s ease-in-out infinite; }
    .ring.b { animation-delay: -3s; }
    .float { animation: float 5s ease-in-out infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .fade { animation: fade 0.8s ease-out both; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .3s } .d3 { animation-delay: .5s } .d4 { animation-delay: .7s }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes draw { from { stroke-dashoffset: 260; } to { stroke-dashoffset: 0; } }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity: .55 } 50% { transform: scale(1.04); opacity: 1 } }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes fade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  </style>

  <!-- background -->
  <rect width="1200" height="380" rx="18" fill="#F6F4EE"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="18" fill="none" stroke="#D9D9CF"/>

  <!-- right: circle composition -->
  <circle cx="930" cy="200" r="150" fill="#ECE5D6"/>
  <circle class="ring" cx="930" cy="200" r="168" fill="none" stroke="#C6CCBE" stroke-width="1"/>
  <circle class="ring b" cx="930" cy="200" r="122" fill="none" stroke="#C6CCBE" stroke-width="1"/>

  <!-- terminal card -->
  <g class="float">
    <rect x="820" y="140" width="220" height="120" rx="12" fill="#252621"/>
    <circle cx="840" cy="160" r="4.5" fill="#C34424"/>
    <circle cx="855" cy="160" r="4.5" fill="#66675F"/>
    <circle cx="870" cy="160" r="4.5" fill="#66675F"/>
    <text x="838" y="198" class="mono" font-size="15" fill="#F0F0E4"><tspan fill="#C34424">&gt;_</tspan> whoami</text>
    <text x="838" y="224" class="mono" font-size="15" fill="#B7BEB0">sifat — builder</text>
    <rect class="blink" x="838" y="234" width="9" height="16" fill="#F0F0E4"/>
  </g>

  <!-- code glyph -->
  <text x="760" y="110" class="mono accent" font-size="26">&lt;/&gt;</text>

  <!-- asterisk -->
  <g class="spin" stroke="#C34424" stroke-width="3" stroke-linecap="round">
    <line x1="1010" y1="70" x2="1010" y2="114"/>
    <line x1="988" y1="92" x2="1032" y2="92"/>
    <line x1="994.4" y1="76.4" x2="1025.6" y2="107.6"/>
    <line x1="994.4" y1="107.6" x2="1025.6" y2="76.4"/>
  </g>

  <!-- wordmark -->
  <text x="1040" y="335" class="sans ink" font-size="30" font-weight="600" letter-spacing="-0.5">sifat<tspan class="accent">.</tspan></text>
  <text x="1040" y="290" class="mono muted" font-size="10" letter-spacing="1.5">THE HUMAN</text>
  <text x="1040" y="304" class="mono muted" font-size="10" letter-spacing="1.5">BEHIND THE CODE</text>

  <!-- left: copy -->
  <g class="fade d1">
    <g stroke="#C34424" stroke-width="1.6" stroke-linecap="round">
      <line x1="72" y1="68" x2="72" y2="84"/><line x1="64" y1="76" x2="80" y2="76"/>
      <line x1="66.3" y1="70.3" x2="77.7" y2="81.7"/><line x1="66.3" y1="81.7" x2="77.7" y2="70.3"/>
    </g>
    <text x="92" y="81" class="mono accent" font-size="13" letter-spacing="2">INDEPENDENT MIND. CONNECTED SYSTEMS.</text>
  </g>

  <text x="62" y="158" class="sans ink fade d2" font-size="58" font-weight="500" letter-spacing="-2">A little curiosity.</text>
  <text x="62" y="226" class="sans ink fade d3" font-size="58" font-weight="500" letter-spacing="-2">A lot of <tspan class="accent">building</tspan>.</text>
  <path class="draw" d="M258 246 C 310 238, 400 238, 464 244" fill="none" stroke="#C34424" stroke-width="3" stroke-linecap="round"/>

  <text x="64" y="286" class="sans muted fade d4" font-size="19">Sifat Ahmed · Self-taught software developer</text>
  <text x="64" y="312" class="sans muted fade d4" font-size="19">Apps, AI &amp; the systems behind them.</text>

  <g class="fade d4">
    <circle cx="68" cy="346" r="3.5" fill="#C34424"/>
    <text x="80" y="350" class="mono muted" font-size="11" letter-spacing="1.5">BASED IN BANGLADESH  /  BUILDING FOR THE WEB &amp; BEYOND</text>
  </g>
</svg>

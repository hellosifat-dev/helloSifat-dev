<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="SI-Agent — My own AI assistant, in Bangla and English. Visit agent.sifat.codes">
  <style>
    .sans { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .fade { animation: fade .8s ease-out both; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .25s } .d3 { animation-delay: .4s } .d4 { animation-delay: .55s }
    .pa { animation: up 1s .2s cubic-bezier(.2,.7,.2,1) both; }
    .fa { animation: bob 6s 1.2s ease-in-out infinite; }
    .live { animation: pulse 2.4s ease-in-out infinite; }
    .b1 { animation: fade .6s 1.0s ease-out both; } .b2 { animation: fade .6s 1.6s ease-out both; } .b3 { animation: fade .6s 2.2s ease-out both; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    @keyframes up { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
    .ink { fill: #1F2233; } .muted { fill: #686C7E; }
  </style>
  <defs>
    <clipPath id="card"><rect width="600" height="300" rx="16"/></clipPath>
    <clipPath id="win"><rect x="320" y="58" width="258" height="161" rx="0"/></clipPath>
    <radialGradient id="glow" cx="80%" cy="40%" r="60%"><stop offset="0" stop-color="#C34424" stop-opacity=".12"/><stop offset="1" stop-color="#F4F4F1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1F2233" stroke-opacity=".045"/></pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F2233" flood-opacity=".14"/></filter>
  </defs>
  <g clip-path="url(#card)">
    <rect width="600" height="300" fill="#F4F4F1"/><rect width="600" height="300" fill="url(#grid)"/><rect width="600" height="300" fill="url(#glow)"/>
    <g class="fade d1">
      <rect x="32" y="28" width="38" height="38" rx="9" fill="#C34424"/>
      <text x="51" y="53" class="sans" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">SI</text>
      <text x="80" y="56" class="sans ink" font-size="24" font-weight="700" letter-spacing="-.4">SI-Agent</text>
    </g>
    <g class="fade d2">
      <rect x="34" y="80" width="173" height="24" rx="12" fill="#C34424" fill-opacity=".12"/>
      <circle class="live" cx="47" cy="92" r="4" fill="#C34424"/>
      <text x="57" y="96.5" class="mono" font-size="12.5" font-weight="600" fill="#C34424" letter-spacing=".6">RUNS ON MY LAPTOP</text>
    </g>
    <text x="32" y="146" class="sans ink fade d2" font-size="31" font-weight="600" letter-spacing="-1">My own AI</text>
    <text x="32" y="182" class="sans ink fade d3" font-size="31" font-weight="600" letter-spacing="-1">assistant, in</text>
    <text x="32" y="218" fill="#C34424" class="sans fade d3" font-size="31" font-weight="600" letter-spacing="-1">Bangla &amp; English.</text>
    <g class="fade d4">
      <text x="34" y="252" class="sans muted" font-size="13">Local models · My own hardware</text>
      <text x="34" y="274" class="mono" font-size="13.5" font-weight="600" fill="#C34424">agent.sifat.codes ↗</text>
    </g>
    <g class="pa"><g class="fa" filter="url(#sh)">
      <rect x="320" y="30" width="258" height="230" rx="14" fill="#FFFFFF" stroke="#E3E3DE"/>
      <circle cx="338" cy="44" r="4" fill="#E86A5B"/><circle cx="352" cy="44" r="4" fill="#E8B54F"/><circle cx="366" cy="44" r="4" fill="#5DBB6B"/>
      <rect x="380" y="36" width="182" height="16" rx="8" fill="#F1F1EC"/>
      <text x="471" y="48" class="mono muted" font-size="10" text-anchor="middle">agent.sifat.codes</text>
      <image x="320" y="58" width="258" height="161" clip-path="url(#win)" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64,"/>
      <line x1="320" y1="219" x2="578" y2="219" stroke="#EDEDE8"/>
      <text x="336" y="244" class="sans ink" font-size="13" font-weight="700">Live app</text>
      <text x="562" y="244" class="sans muted" font-size="12" text-anchor="end">online when my laptop is on</text>
    </g></g>
  </g>
  <rect x=".5" y=".5" width="599" height="299" rx="16" fill="none" stroke="#E3E3DE"/>
</svg>
